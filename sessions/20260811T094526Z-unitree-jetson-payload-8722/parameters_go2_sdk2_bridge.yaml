/go2_sdk2_bridge:
  ros__parameters:
    body_frame: base_link
    command_rate: 20.0
    domain_id: 0
    enabled: false
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.2
    linear_gain: 1.0
    lookahead_distance: 0.6
    max_vx: 0.6
    max_vy: 0.35
    max_yaw_rate: 0.8
    network_interface: enP8p1s0
    odom_timeout: 0.5
    odom_topic: /lio/body_odom
    path_timeout: 1.0
    path_topic: /body_path
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    timestamp_future_tolerance: 0.2
    use_sim_time: false
    world_frame: world
    yaw_gain: 1.5

