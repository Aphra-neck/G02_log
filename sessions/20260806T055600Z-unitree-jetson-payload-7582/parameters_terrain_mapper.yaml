/terrain_mapper:
  ros__parameters:
    cloud_topic: /lio/cloud_world
    confidence_frames: 8.0
    height_bin_resolution: 0.015
    integration_window: 1.5
    map_frame: world
    max_range: 12.0
    max_roughness: 0.08
    max_slope: 0.65
    max_step_height: 0.24
    max_z_relative: 1.5
    min_observed_frames: 4
    min_points_per_cell: 1
    min_range: 0.35
    min_z_relative: -1.5
    obstacle_height: 0.18
    odom_topic: /lio/body_odom
    origin_x: -20.0
    origin_y: -20.0
    publish_rate: 2.0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    resolution: 0.2
    self_filter:
      height: 0.7
      length: 0.9
      width: 0.55
    size_x: 40.0
    size_y: 40.0
    use_sim_time: false

