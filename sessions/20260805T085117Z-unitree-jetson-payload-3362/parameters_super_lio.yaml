        - 0.0
        - 0.0
        - 0.0
        - 0.0
        update_map: false
      ros:
        imu_topic: /imu/data
        lidar_topic: /lidar_points
      sensor:
        blind: 0.5
        enable_downsample: true
        filter_rate: 1
        gravity_norm: 9.4188
        imu_na: 0.1
        imu_nba: 0.0001
        imu_nbg: 0.0001
        imu_ng: 0.1
        imu_type: 1
        lidar_type: 2
        maxrange: 150.0
        voxel_fliter_size: 0.3
      submap:
        submap_capacity: 0
        submap_resolution: 0.0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
    use_sim_time: false

